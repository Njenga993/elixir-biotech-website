<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 
      1. BETTER TITLE 
      This shows in the browser tab before React loads.
    -->
    <title>Elixir Biotech | Clean Bioethanol Fuel in Kenya</title>

    <!-- 
      2. FALLBACK META DESCRIPTION 
      Static description for crawlers that execute JS slowly.
    -->
    <meta name="description" content="Elixir Biotech transforms organic waste into affordable bioethanol gel fuel. A safe, sustainable alternative to charcoal and kerosene for households in Nairobi." />

    <!-- 
      3. OPEN GRAPH (Social Media) FALLBACKS 
      If someone shares your site on Twitter/Facebook and JS hasn't loaded yet,
      these tags ensure a preview still shows up.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elixirbiotech.co.ke/" />
    <meta property="og:title" content="Elixir Biotech | Clean Bioethanol Fuel in Kenya" />
    <meta property="og:description" content="Elixir Biotech transforms organic waste into affordable bioethanol gel fuel." />
    <meta property="og:image" content="https://elixirbiotech.co.ke/assets/images/image2.png" />
    <meta property="og:site_name" content="Elixir Biotech" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 
      4. THEME COLOR
      Matches your Navy (#0f1a20) for the address bar on mobile devices.
    -->
    <meta name="theme-color" content="#0f1a20" />

    <!-- 
      5. PRECONNECT
      Speeds up loading of Google Fonts (if you use them).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 
      6. NOSCRIPT FALLBACK STYLES
      If a user has JS disabled, they will see this clean error message 
      instead of a blank white page.
    -->
    <style>
      .no-js-fallback {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background-color: #0f1a20; /* Navy */
        color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }
      .no-js-fallback h1 { margin-bottom: 10px; color: #82AF24; }
      .no-js-fallback a { color: #82AF24; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Fallback message for users with JavaScript disabled -->
    <noscript>
      <div class="no-js-fallback">
        <h1>Elixir Biotech</h1>
        <p>Please enable JavaScript to view this website.</p>
        <a href="https://www.enable-javascript.com/">How to enable JavaScript</a>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
