    <style>
      .no-js-fallback {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #0f1a20;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .no-js-fallback h1 {
        margin-bottom: 10px;
        color: #82AF24;
        font-size: 2rem;
      }
      .no-js-fallback p {
        max-width: 400px;
        line-height: 1.6;
        margin-bottom: 20px;
        opacity: 0.9;
      }
      .no-js-fallback a {
        color: #82AF24;
        text-decoration: underline;
        font-weight: 600;
        padding: 10px 20px;
        border: 2px solid #82AF24;
        border-radius: 6px;
        transition: all 0.3s ease;
      }
      .no-js-fallback a:hover {
        background-color: #82AF24;
        color: #0f1a20;
      }
    </style>
